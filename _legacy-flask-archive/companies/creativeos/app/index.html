<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreativeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0B0A09;--bg-1:#131110;--bg-2:#1A1715;--bg-3:#241F1C;--line:#2E2926;--line-2:#403933;
  --text-hi:#F6F1EA;--text-mid:#AEA49A;--text-lo:#7A6F65;
  --accent:#E5482D;--accent-hi:#FF6242;--accent-dim:rgba(229,72,45,.15);
  --framevault:#E5482D;--filmcrew:#F5892B;--rightsforge:#C0311C;--creatorstack:#F26B1D;--studio:#E8A020;--home:#AEA49A;--feed:#E5482D;--reels:#E5482D;--discover:#F5892B;--learn:#E9B949;
  --ok:#E9B949;--warn:#F5892B;--err:#E5482D;
  --font-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-display:"Space Grotesk","IBM Plex Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --scroll:#2b2521;--scroll-h:#3a332d;--sel:rgba(229,72,45,.32);
}
body[data-theme="light"]{
  --bg-0:#F1EBE2;--bg-1:#FBF7F1;--bg-2:#FFFFFF;--bg-3:#EFE8DD;--line:#E2D9CB;--line-2:#CFC3B2;
  --text-hi:#1C1613;--text-mid:#5E554C;--text-lo:#938779;
  --accent:#D0381F;--accent-hi:#E5482D;--accent-dim:rgba(208,56,31,.12);
  --framevault:#C63A22;--filmcrew:#CE6C18;--rightsforge:#A82E1A;--creatorstack:#CF561A;--studio:#B47C12;--home:#5E554C;--feed:#C63A22;--reels:#C63A22;--discover:#CE6C18;--learn:#A67C15;
  --ok:#8A7314;--warn:#CE6C18;--err:#C63A22;
  --scroll:#d8cdbd;--scroll-h:#c3b6a2;--sel:rgba(208,56,31,.2);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-0);color:var(--text-hi);font-family:var(--font-sans);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .25s ease,color .25s ease}
#root{height:100%}
h1,h2{font-family:var(--font-display);font-weight:600}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hi)}
button{font-family:inherit}
input,textarea{font-family:inherit}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:2px solid var(--bg-0)}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-h)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes drift{0%{background-position:0% 50%}100%{background-position:120% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============================================================
   CreativeOS — full app (social + course + six products)
   Implemented from the Claude Design import (CreativeOS.dc.html).
   Dependency-free SPA: state -> renderVals() -> view() -> DOM.
   ============================================================ */
(function(){
  var root=document.getElementById('root');

  /* ---- per-render handler registry + helpers ---- */
  var H=[];
  function A(fn){ H.push(fn); return H.length-1; }
  function hv(str){ return 'data-hover="'+encodeURIComponent(str)+'"'; }
  function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

  /* ---- state ---- */
  var _t,_wl,_ty;
  var state={
    view:'home', reel:0, cmd:false, q:'', notif:false, pmenu:false, toast:'',
    likes:{}, follows:{maya:true, kestrel:true}, saved:{},
    commentsPost:null, draft:'', added:{}, dtab:'all', muted:true,
    fvTab:'work', sfTab:'all', rhTab:'luts', msgThread:0, msgDraft:'', msgAdded:{},
    unread:3, w:(typeof window!=='undefined'?window.innerWidth:1280),
    theme:(typeof localStorage!=='undefined'&&localStorage.getItem('cos-theme'))||'dark'
  };

  function setState(patch){ var p=typeof patch==='function'?patch(state):patch; for(var k in p) state[k]=p[k]; render(); }

  /* ---- actions ---- */
  function toast(m){ setState({toast:m}); clearTimeout(_t); _t=setTimeout(function(){ setState({toast:''}); },2200); }
  function nav(v){ setState({view:v, cmd:false, notif:false, pmenu:false}); }
  function like(id){ setState(function(s){ var l=Object.assign({},s.likes); l[id]=!l[id]; return {likes:l}; }); }
  function follow(h,name){ var on=!state.follows[h]; setState(function(s){ var f=Object.assign({},s.follows); f[h]=!f[h]; return {follows:f}; }); toast(on?('Following '+(name||h)):('Unfollowed '+(name||h))); }
  function save(id){ setState(function(s){ var v=Object.assign({},s.saved); v[id]=!v[id]; return {saved:v}; }); toast(state.saved[id]?'Saved':'Removed from saved'); }
  function openComments(id){ setState({commentsPost:id, notif:false, pmenu:false}); }
  function closeComments(){ setState({commentsPost:null, draft:''}); }
  function postComment(){ var d=state.draft.trim(); if(!d) return; var id=state.commentsPost; setState(function(s){ var a=Object.assign({},s.added); a[id]=(a[id]||[]).concat([{name:'OTT',initials:'O',time:'now',text:d,grad:'linear-gradient(135deg,var(--accent),#8a1e0e)'}]); return {added:a, draft:''}; }); }
  function sendMsg(){ var d=state.msgDraft.trim(); if(!d) return; var th=state.msgThread; setState(function(s){ var a=Object.assign({},s.msgAdded); a[th]=(a[th]||[]).concat([{me:true,text:d}]); return {msgAdded:a, msgDraft:''}; }); }
  function toggleTheme(){ setState(function(s){ var t=s.theme==='dark'?'light':'dark'; document.body.dataset.theme=t; try{localStorage.setItem('cos-theme',t);}catch(e){} return {theme:t}; }); }

  /* ---- data ---- */
  var PEOPLE={
    maya:{name:'Maya Rún',handle:'maya',role:'Director',initials:'MR',verified:true,grad:'linear-gradient(135deg,#E5482D,#8a1e0e)'},
    kestrel:{name:'Studio Kestrel',handle:'kestrel',role:'Production company',initials:'SK',verified:true,grad:'linear-gradient(135deg,#F5892B,#9a4a12)'},
    ivo:{name:'Ivo Lindqvist',handle:'ivo',role:'Colorist',initials:'IL',verified:false,grad:'linear-gradient(135deg,#E9B949,#8a6414)'},
    nadia:{name:'Nadia Okonkwo',handle:'nadia',role:'Cinematographer',initials:'NO',verified:true,grad:'linear-gradient(135deg,#F26B1D,#8a3410)'},
    theo:{name:'Theo Marchetti',handle:'theo',role:'Composer',initials:'TM',verified:false,grad:'linear-gradient(135deg,#E5482D,#7a1c10)'},
    priya:{name:'Priya Anand',handle:'priya',role:'VFX artist',initials:'PA',verified:true,grad:'linear-gradient(135deg,#E8A020,#8a5410)'}
  };
  var COVERS=[
    'background:radial-gradient(120% 90% at 20% 10%,#4a1e10,#160a06),linear-gradient(135deg,#5a2410,#160a06)',
    'background:radial-gradient(120% 90% at 80% 15%,#5a2e0a,#1a0e04),linear-gradient(135deg,#7a3e10,#1a0e04)',
    'background:radial-gradient(120% 90% at 30% 20%,#5a3a1a,#1f1408),linear-gradient(135deg,#7a4e1e,#241708)',
    'background:radial-gradient(120% 90% at 70% 10%,#4a1410,#1a0806),linear-gradient(135deg,#5c1a14,#1a0806)',
    'background:radial-gradient(120% 90% at 25% 15%,#5a1810,#210a06),linear-gradient(135deg,#7a2414,#260d0a)',
    'background:radial-gradient(120% 90% at 75% 20%,#5a3e14,#1a1206),linear-gradient(135deg,#7a5418,#1a1206)'
  ];
  function avatar(p,size,ring){ var s=size||36; return 'width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+p.grad+';display:grid;place-items:center;font-size:'+(s*0.34)+'px;font-weight:700;color:#fff;flex:0 0 auto;cursor:pointer'+(ring?';box-shadow:0 0 0 2px var(--bg-2),0 0 0 4px '+ring:''); }
  function chip(hue,label){ return {label:label, style:'font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:'+hue+';background:color-mix(in srgb,'+hue+' 14%,transparent);border:1px solid color-mix(in srgb,'+hue+' 34%,transparent)'}; }

  /* ---- computed props for the current state ---- */
  function renderVals(){
    var s=state, W=s.w;
    var desktop=W>=980, tablet=W>=760&&W<980, mobile=W<760, compact=!desktop;
    var P=PEOPLE, C=COVERS;
    var likedOf=function(id){return !!s.likes[id];}, folOf=function(h){return !!s.follows[h];};

    var appStyle = compact
      ? 'display:flex;flex-direction:column;height:100vh;background:var(--bg-0)'
      : "display:grid;grid-template-columns:216px 1fr;grid-template-rows:56px 1fr;grid-template-areas:'brand bar' 'rail pane';height:100vh;background:var(--bg-0)";
    var barStyle = (compact?'':'grid-area:bar;')+'display:flex;align-items:center;gap:10px;padding:0 14px;height:56px;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg-1);z-index:20';
    var paneStyle = (compact?'flex:1;':'grid-area:pane;')+'overflow-y:auto;position:relative';

    var HUE={home:'var(--home)',reels:'var(--reels)',discover:'var(--discover)',framevault:'var(--framevault)',filmcrew:'var(--filmcrew)',rightsforge:'var(--rightsforge)',creatorstack:'var(--creatorstack)',studio:'var(--studio)',learn:'var(--learn)',settings:'var(--text-lo)',messages:'var(--accent)'};
    var RAIL=[
      {grp:'Social'},{v:'home',label:'Home'},{v:'reels',label:'Reels'},{v:'discover',label:'Discover'},
      {grp:'Workspace'},{v:'framevault',label:'FrameVault'},
      {grp:'Products'},{v:'filmcrew',label:'FilmCrew'},{v:'rightsforge',label:'RightsForge'},{v:'creatorstack',label:'CreatorStack'},{v:'studio',label:'OTT Studio'},{v:'learn',label:'Learn'},
      {sp:true},{v:'settings',label:'Settings'}
    ];
    var navItems=RAIL.map(function(n){
      if(n.grp) return {isGroup:true,isItem:false,label:n.grp,wrapStyle:'padding:10px 8px 3px',hoverStyle:'',dotStyle:'',onClick:function(){}};
      if(n.sp) return {isGroup:false,isItem:false,label:'',wrapStyle:'flex:1',hoverStyle:'',dotStyle:'',onClick:function(){}};
      var active=n.v===s.view, hue=HUE[n.v];
      return {isGroup:false,isItem:true,label:n.label,onClick:function(){nav(n.v);},
        wrapStyle:'display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;position:relative;transition:.14s;'+(active?'background:var(--accent-dim);color:var(--text-hi);box-shadow:inset 3px 0 0 '+hue:'color:var(--text-mid)'),
        hoverStyle:active?'':'background:var(--bg-2);color:var(--text-hi)',
        dotStyle:'width:15px;height:15px;border-radius:5px;flex:0 0 auto;background:'+hue+';opacity:'+(active?'1':'.8')+(active?';box-shadow:0 0 12px '+hue:'')};
    });

    var mob=[{v:'home',icon:'⌂',label:'Home'},{v:'discover',icon:'⬚',label:'Discover'},{v:'reels',icon:'▶',label:'Reels'},{v:'messages',icon:'✉',label:'Inbox'},{v:'framevault',icon:'◍',label:'You'}];
    var mobileNav=mob.map(function(m){ var on=m.v===s.view; return {icon:m.icon,label:m.label,onClick:function(){nav(m.v);},style:'display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:6px 10px;color:'+(on?'var(--text-hi)':'var(--text-lo)')}; });

    var storyOrder=['maya','kestrel','nadia','ivo','theo','priya'];
    var stories=[{name:'Your story',initials:'O',grad:'linear-gradient(135deg,var(--accent),#8a1e0e)',own:true}].concat(storyOrder.map(function(h){return {name:P[h].name.split(' ')[0],initials:P[h].initials,grad:P[h].grad};})).map(function(st){ return {
      name:st.name, initials:st.initials, onClick:(function(st){return function(){toast(st.own?'Add to your story':st.name+'’s story — reel + behind-the-scenes');};})(st),
      ringStyle:'display:grid;place-items:center;width:60px;height:60px;border-radius:50%;'+(st.own?'background:var(--bg-3);border:2px dashed var(--line)':'background:conic-gradient(from 210deg,var(--accent),var(--creatorstack),var(--rightsforge),var(--accent));padding:2px'),
      avStyle:'width:54px;height:54px;border-radius:50%;background:'+st.grad+';display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;border:2px solid var(--bg-0)'
    }; });

    var followBtn=function(on,light){ return light
      ? 'background:'+(on?'rgba(255,255,255,.16)':'#fff')+';color:'+(on?'#fff':'#0a0a0a')+';border:1px solid '+(on?'rgba(255,255,255,.3)':'transparent')+';font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer'
      : 'background:'+(on?'transparent':'var(--accent)')+';color:'+(on?'var(--text-mid)':'#fff')+';border:1px solid '+(on?'var(--line)':'transparent')+';font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;flex:0 0 auto'; };

    var FEED=[
      {id:'f1',a:'nadia',chip:chip('var(--reels)','Reel'),time:'2h',text:'Golden-hour test for “Halcyon”, shot on the 40mm. No grade yet — this is straight off the sensor.',media:0,isReel:true,mediaLabel:'Halcyon · camera test',likes:214,comments:3},
      {id:'f2',a:'kestrel',chip:chip('var(--filmcrew)','FilmCrew'),time:'4h',text:'We’re hiring a Director of Photography for “Halcyon” — 6-day shoot, £1,200. Applications through FilmCrew.',media:1,isReel:false,mediaLabel:'Now hiring · DP',likes:88,comments:12},
      {id:'f3',a:'ivo',chip:chip('var(--rightsforge)','RightsForge'),time:'6h',text:'Dropped a new LUT pack — “Umber”. Warm, filmic, built for skin tones. Licensed 34× this week 🙏',media:2,isReel:false,mediaLabel:'Umber LUT pack',likes:451,comments:27},
      {id:'f4',a:'maya',chip:chip('var(--rightsforge)','RightsForge'),time:'yesterday',text:'“The Archivist” pilot just got optioned. Wild to see something that started as a RightsForge listing become a real production.',media:4,isReel:false,mediaLabel:'The Archivist · optioned',likes:672,comments:41}
    ];
    var feed=FEED.map(function(f){ var p=P[f.a]; var liked=likedOf(f.id), on=folOf(f.a); var cN=f.comments+((s.added[f.id]||[]).length);
      return {id:f.id, author:p, chip:f.chip.label, chipStyle:f.chip.style, time:f.time, text:f.text, hasMedia:f.media!=null, isReel:f.isReel, mediaLabel:f.mediaLabel,
        avStyle:avatar(p,38), mediaStyle:'position:relative;'+C[f.media]+';aspect-ratio:16/10;cursor:pointer;display:block',
        likeN:f.likes+(liked?1:0), commentsN:cN,
        onLike:function(){like(f.id);}, onComment:function(){openComments(f.id);}, onShare:function(){toast('Share sheet — copy link, send to a thread, or cross-post');}, onSave:function(){save(f.id);},
        onAuthor:function(){nav('framevault');}, onOpen:function(){nav(f.isReel?'reels':'discover');}, onFollow:function(){follow(f.a,p.name);},
        followLabel:on?'Following':'Follow', followStyle:followBtn(on,false),
        likeBtnStyle:'display:flex;align-items:center;gap:7px;background:none;border:none;font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;cursor:pointer;color:'+(liked?'var(--creatorstack)':'var(--text-mid)'),
        heartStyle:'font-size:16px;display:inline-block;'+(liked?'animation:pop .3s ease':''),
        saved:!!s.saved[f.id], saveBtnStyle:'margin-left:auto;background:none;border:none;color:'+(s.saved[f.id]?'var(--rightsforge)':'var(--text-mid)')+';font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;cursor:pointer', saveLabel:s.saved[f.id]?'★ Saved':'☆ Save'};
    });

    var suggested=['nadia','theo','priya'].map(function(h){ var p=P[h], on=folOf(h);
      return {name:p.name, role:p.role, initials:p.initials, avStyle:avatar(p,38), onOpen:function(){nav('framevault');}, onFollow:function(){follow(h,p.name);}, followLabel:on?'Following':'Follow', followStyle:followBtn(on,false)}; });

    var REELS=[
      {id:'r1',a:'nadia',caption:'Camera test for “Halcyon”. 40mm, golden hour, no grade. Swipe for the pullback.',music:'Cinematic ambient — Theo Marchetti',tags:[['var(--filmcrew)','DP role open'],['var(--rightsforge)','Umber LUT']],likes:2140,comments:64,shares:88,cover:0},
      {id:'r2',a:'ivo',caption:'Before / after with the Umber LUT. One node, no keys. This is the whole look.',music:'Original sound — Ivo Lindqvist',tags:[['var(--rightsforge)','License £39']],likes:5310,comments:212,shares:340,cover:2},
      {id:'r3',a:'priya',caption:'Roughed in the environment for “Cold Open”. Everything you see past the window is a matte.',music:'Drone pad — royalty-free',tags:[['var(--creatorstack)','Neon Dusk entry'],['var(--rightsforge)','Cold Open']],likes:1890,comments:96,shares:120,cover:5},
      {id:'r4',a:'maya',caption:'One-take blocking rehearsal. We stage the whole scene before a single frame is shot.',music:'On-set audio',tags:[['var(--filmcrew)','Halcyon']],likes:3402,comments:141,shares:210,cover:1},
      {id:'r5',a:'theo',caption:'Scoring “The Archivist” main title. Building it up one layer at a time.',music:'Theo Marchetti — WIP',tags:[['var(--rightsforge)','The Archivist']],likes:1220,comments:58,shares:44,cover:4}
    ];
    var reels=REELS.map(function(r,i){ var p=P[r.a]; var liked=likedOf(r.id), on=folOf(r.a); var cN=r.comments+((s.added[r.id]||[]).length);
      return {id:r.id, active:i===s.reel, author:p, caption:r.caption, music:r.music, shares:r.shares, commentsN:cN,
        cover:C[r.cover], progress:(((i+1)/REELS.length)*100).toFixed(0)+'%',
        avStyle:avatar(p,32)+';border:2px solid #fff',
        likeN:(r.likes+(liked?1:0)>=1000?((r.likes+(liked?1:0))/1000).toFixed(1)+'k':(r.likes+(liked?1:0))),
        heartStyle:'font-size:30px;display:inline-block;color:'+(liked?'var(--creatorstack)':'#fff')+';'+(liked?'animation:pop .3s ease':''),
        onLike:function(){like(r.id);}, onComment:function(){openComments(r.id);}, onShare:function(){toast('Reel shared');}, onAuthor:function(){nav('framevault');}, onFollow:function(){follow(r.a,p.name);}, onGo:(function(i){return function(){setState({reel:i});};})(i),
        followLabel:on?'Following':'Follow', followStyleLight:followBtn(on,true),
        dotStyle:'width:'+(i===s.reel?'8':'6')+'px;height:'+(i===s.reel?'22':'6')+'px;border-radius:999px;background:'+(i===s.reel?'#fff':'var(--line-2)')+';cursor:pointer;transition:.2s',
        tags:r.tags.map(function(t){ return {label:t[1],onClick:(function(t){return function(){toast(t[1]+' — tap opens the linked room');};})(t),style:'font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap;background:color-mix(in srgb,'+t[0]+' 42%,rgba(0,0,0,.4));border:1px solid '+t[0]+';backdrop-filter:blur(6px);cursor:pointer'}; })
      };
    });
    var reel=reels[s.reel]||reels[0];
    var reelsStageStyle='position:relative;height:100%;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#14101f,var(--bg-0))'+(mobile?';padding-bottom:58px':(compact?';padding:24px 24px 82px':';padding:24px'));
    var phoneStyle=mobile
      ? 'position:relative;width:100%;height:100%;overflow:hidden'
      : 'position:relative;width:400px;max-width:92vw;aspect-ratio:9/16;max-height:calc(100vh - 120px);border-radius:30px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)';

    var DTABS=[['all','All'],['reels','Reels'],['work','Work'],['creators','Creators']];
    var discoverTabs=DTABS.map(function(t){ var on=s.dtab===t[0]; return {label:t[1],onClick:(function(t){return function(){setState({dtab:t[0]});};})(t),style:'padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid '+(on?'var(--accent)':'var(--line)')+';background:'+(on?'var(--accent-dim)':'var(--bg-2)')+';color:'+(on?'var(--text-hi)':'var(--text-mid)')}; });
    var DISC=[
      {t:'Halcyon — camera test',by:'Nadia Okonkwo',a:'nadia',tag:'Reel',hue:'var(--reels)',reel:true,cover:0,likes:'2.1k',span:2,kind:'reels'},
      {t:'Umber LUT — before/after',by:'Ivo Lindqvist',a:'ivo',tag:'RightsForge',hue:'var(--rightsforge)',reel:true,cover:2,likes:'5.3k',span:1,kind:'reels'},
      {t:'The Archivist — key art',by:'Maya Rún',a:'maya',tag:'RightsForge',hue:'var(--rightsforge)',reel:false,cover:4,likes:'672',span:1,kind:'work'},
      {t:'Cold Open — matte',by:'Priya Anand',a:'priya',tag:'VFX',hue:'var(--studio)',reel:false,cover:5,likes:'1.2k',span:1,kind:'work'},
      {t:'Blocking rehearsal',by:'Maya Rún',a:'maya',tag:'Reel',hue:'var(--reels)',reel:true,cover:1,likes:'3.4k',span:1,kind:'reels'},

      '<div style="margin-top:24px;display:flex;align-items:center;justify-content:space-between;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px"><div><div style="font-size:14px;font-weight:600">Signed in as OTT</div><div style="font-size:12.5px;color:var(--text-lo)">@ott · one identity, six products</div></div><button data-click="'+A(V.toastSignout)+'" style="height:36px;padding:0 15px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--err);font-weight:600;font-size:13px;cursor:pointer">Sign out</button></div></div>';
    }

    var main = '<main style="'+V.paneStyle+'"><div style="'+V.paneKey+'">'+screen+'</div></main>';

    var mobileBottom = V.compact ?
      '<nav style="position:fixed;bottom:0;left:0;right:0;height:58px;background:color-mix(in srgb,var(--bg-1) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;z-index:30">'+
      V.mobileNav.map(function(m){ return '<button data-click="'+A(m.onClick)+'" style="'+m.style+'"><span style="font-size:19px">'+m.icon+'</span><small style="font-size:9.5px;font-weight:600">'+m.label+'</small></button>'; }).join('')+
      '</nav>' : '';

    /* ---- overlays ---- */
    var overlays='';
    if(V.cmd){
      overlays+=
      '<div data-click="'+A(V.closeCmd)+'" style="position:fixed;inset:0;background:rgba(4,5,7,.66);backdrop-filter:blur(3px);z-index:50;animation:fadein .15s"></div>'+
      '<div style="position:fixed;z-index:51;top:13vh;left:50%;transform:translateX(-50%);width:min(600px,92vw);background:var(--bg-1);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;animation:rise .18s ease"><div style="display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)"><span style="color:var(--text-lo)">⌕</span><input data-focus="cmd" value="'+esc(V.q)+'" data-input="'+A(V.onCmdInput)+'" placeholder="Search people, projects, IP, assets, challenges…" style="flex:1;background:transparent;border:none;outline:none;color:var(--text-hi);font-size:16px" /><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-lo);border:1px solid var(--line);border-radius:5px;padding:1px 6px">esc</span></div><div style="max-height:52vh;overflow-y:auto;padding:8px">'+
      (V.cmdEmpty?'<div style="padding:26px;text-align:center;color:var(--text-lo);font-size:14px">No matches. One index spans every product.</div>':'')+
      V.cmdGroups.map(function(g){ return '<div style="margin:6px 8px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-lo);font-weight:700">'+g.prod+'</div>'+g.items.map(function(i){ return '<div data-click="'+A(i.onClick)+'" '+hv('background:var(--accent-dim)')+' style="display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;cursor:pointer"><span style="'+i.tyStyle+'">'+i.ty+'</span><span style="flex:1;font-size:14px;color:var(--text-hi)">'+i.t+' <small style="color:var(--text-lo)">· '+i.s+'</small></span><span style="margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:'+i.h+'">'+i.type+'</span></div>'; }).join(''); }).join('')+
      '</div></div>';
    }
    if(V.notifOpen){
      overlays+=
      '<div data-click="'+A(V.closeDrops)+'" style="position:fixed;inset:0;z-index:44"></div>'+
      '<div style="position:fixed;top:52px;right:120px;width:340px;background:var(--bg-1);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.55);z-index:45;overflow:hidden;animation:rise .16s ease"><div style="display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)"><b style="font-size:14px">Notifications</b><a data-click="'+A(V.markRead)+'" style="font-size:12px;color:var(--accent-hi);cursor:pointer">Mark all read</a></div><div style="max-height:360px;overflow-y:auto">'+
      V.notifs.map(function(n){ return '<div data-click="'+A(n.onClick)+'" style="'+n.rowStyle+'"><span style="'+n.dotStyle+'"></span><div><div style="font-size:13px"><span style="font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.05em;color:'+n.h+'">'+n.prod+'</span> · <span style="color:var(--text-mid)">'+n.txt+'</span></div><div style="font-size:11.5px;color:var(--text-lo);margin-top:3px">'+n.t+'</div></div></div>'; }).join('')+
      '</div></div>';
    }
    if(V.pmenuOpen){
      overlays+=
      '<div data-click="'+A(V.closeDrops)+'" style="position:fixed;inset:0;z-index:44"></div>'+
      '<div style="position:fixed;top:52px;right:14px;width:280px;background:var(--bg-1);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.55);z-index:45;overflow:hidden;animation:rise .16s ease"><div style="padding:15px;border-bottom:1px solid var(--line)"><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-lo);font-weight:700;margin-bottom:6px">Wallet balance</div><div style="font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums">£3,412.00</div></div>'+
      V.pmenuItems.map(function(m){ return '<div data-click="'+A(m.onClick)+'" '+hv('background:var(--bg-2);color:var(--text-hi)')+' style="display:flex;align-items:center;gap:10px;padding:11px 15px;cursor:pointer;font-size:13.5px;color:var(--text-mid)">'+m.label+'</div>'; }).join('')+
      '</div>';
    }
    if(V.commentsPost){
      overlays+=
      '<div data-click="'+A(V.closeComments)+'" style="position:fixed;inset:0;background:rgba(4,5,7,.6);backdrop-filter:blur(2px);z-index:52;animation:fadein .15s"></div>'+
      '<div style="'+V.commentsSheetStyle+'"><div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)"><b style="font-size:15px">Comments</b><button data-click="'+A(V.closeComments)+'" style="background:none;border:none;color:var(--text-lo);font-size:20px;cursor:pointer">✕</button></div><div style="flex:1;overflow-y:auto;padding:8px 18px">'+
      V.comments.map(function(c){ return '<div style="display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)"><span style="'+c.avStyle+'">'+c.initials+'</span><div style="flex:1"><div style="font-size:13.5px"><b>'+c.name+'</b> <span style="color:var(--text-lo);font-size:12px">· '+c.time+'</span></div><div style="font-size:13.5px;color:var(--text-mid);margin-top:2px">'+c.text+'</div></div></div>'; }).join('')+
      '</div><div style="display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)"><input data-focus="draft" value="'+esc(V.draft)+'" data-input="'+A(V.onDraft)+'" data-key="'+A(V.onDraftKey)+'" placeholder="Add a comment…" style="flex:1;height:38px;background:var(--bg-0);border:1px solid var(--line);border-radius:8px;padding:0 12px;color:var(--text-hi);outline:none;font-size:14px" /><button data-click="'+A(V.postComment)+'" '+hv('background:var(--accent-hi)')+' style="height:38px;padding:0 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer">Post</button></div></div>';
    }
    if(V.toastMsg){
      overlays+='<div style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--bg-3);border:1px solid var(--line);color:var(--text-hi);padding:11px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:60;animation:rise .22s ease">'+V.toastMsg+'</div>';
    }

    return '<div style="'+V.appStyle+'">'+brand+bar+rail+main+mobileBottom+'</div>'+overlays;
  }

  /* ---- wiring + render ---- */
  function wire(){
    root.querySelectorAll('[data-click]').forEach(function(el){ el.addEventListener('click',function(e){ H[+el.getAttribute('data-click')](e); }); });
    root.querySelectorAll('[data-input]').forEach(function(el){ el.addEventListener('input',function(e){ H[+el.getAttribute('data-input')](e); }); });
    root.querySelectorAll('[data-key]').forEach(function(el){ el.addEventListener('keydown',function(e){ H[+el.getAttribute('data-key')](e); }); });
    root.querySelectorAll('[data-wheel]').forEach(function(el){ el.addEventListener('wheel',function(e){ H[+el.getAttribute('data-wheel')](e); },{passive:true}); });
    root.querySelectorAll('[data-tstart]').forEach(function(el){ el.addEventListener('touchstart',function(e){ H[+el.getAttribute('data-tstart')](e); },{passive:true}); });
    root.querySelectorAll('[data-tend]').forEach(function(el){ el.addEventListener('touchend',function(e){ H[+el.getAttribute('data-tend')](e); },{passive:true}); });
    root.querySelectorAll('[data-hover]').forEach(function(el){
      var base=el.getAttribute('style')||''; var h=decodeURIComponent(el.getAttribute('data-hover'));
      el.addEventListener('mouseenter',function(){ el.setAttribute('style',base+';'+h); });
      el.addEventListener('mouseleave',function(){ el.setAttribute('style',base); });
    });
  }

  var V;
  function render(){
    var a=document.activeElement, fid=(a&&a.getAttribute)?a.getAttribute('data-focus'):null;
    var ss=0,se=0; if(fid){ try{ ss=a.selectionStart; se=a.selectionEnd; }catch(e){} }
    H=[]; V=renderVals(); root.innerHTML=view(V); wire();
    if(fid){ var el=root.querySelector('[data-focus="'+fid+'"]'); if(el){ el.focus(); try{ el.setSelectionRange(ss,se); }catch(e){} } }
  }

  /* ---- init ---- */
  document.body.dataset.theme=state.theme;
  window.addEventListener('resize',function(){ setState({w:window.innerWidth}); });
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); setState(function(s){return {cmd:!s.cmd,q:''};}); }
    else if(e.key==='Escape'){ setState({cmd:false,notif:false,pmenu:false,commentsPost:null}); }
  });
  render();
})();
</script>
</body>
</html>
