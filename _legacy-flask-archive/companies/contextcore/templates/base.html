<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ContextCore{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    (function(){ try{ var t=localStorage.getItem('ott-theme'); if(!t){ t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; } document.documentElement.setAttribute('data-theme',t); }catch(e){} })();
  </script>
</head>
<body>
  <header class="top">
    <div class="brand"><b>ContextCore</b><span>Data Refineries</span></div>
    <nav>
      <a href="/" class="{{ 'active' if active=='home' }}">Documents</a>
      <a href="/connect" class="{{ 'active' if active=='connect' }}">Connect</a>
    </nav>
    <button class="theme-toggle" onclick="openPalette()" title="Search (Ctrl/Cmd+K)" style="margin-right:8px">&#128269;</button>
    <button class="theme-toggle" onclick="ottToggleTheme()" title="Toggle light / dark"><span id="theme-icon">&#9789;</span></button>
  </header>

  <div class="palette-scrim hidden" id="paletteScrim" onclick="closePalette()"></div>
  <div class="palette hidden" id="palette" role="dialog" aria-label="Search documents and collections" aria-modal="true">
    <div class="palette-input-row">
      <span class="palette-icon" aria-hidden="true">&#128269;</span>
      <input type="text" id="paletteInput" placeholder="Search documents, collections…" autocomplete="off">
      <span class="kbd">esc</span>
    </div>
    <div class="palette-results" id="paletteResults"></div>
  </div>

  <script>
    function ottToggleTheme(){
      var next = (document.documentElement.getAttribute('data-theme')==='dark') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('ott-theme', next); }catch(e){}
      var icon = document.getElementById('theme-icon');
      if(icon) icon.innerHTML = next==='dark' ? '&#9789;' : '&#9788;';
    }
    document.addEventListener('DOMContentLoaded', function(){
      var icon = document.getElementById('theme-icon');
      if(icon) icon.innerHTML = document.documentElement.getAttribute('data-theme')==='dark' ? '&#9789;' : '&#9788;';
    });

    /* ---- command palette (Ctrl/Cmd+K) — searches /api/search live ---- */
    (function(){
      var selIdx = 0, results = [], debounceTimer = null;
      function els(){ return { scrim: document.getElementById('paletteScrim'), panel: document.getElementById('palette'), input: document.getElementById('paletteInput'), list: document.getElementById('paletteResults') }; }
      window.openPalette = function(){
        var e = els(); if(!e.scrim) return;
        e.scrim.classList.remove('hidden'); e.panel.classList.remove('hidden');
        e.input.value = ''; render([]); e.input.focus();
      };
      window.closePalette = function(){
        var e = els(); if(e.scrim) e.scrim.classList.add('hidden'); if(e.panel) e.panel.classList.add('hidden');
      };
      function render(list){
        results = list; selIdx = 0;
        var host = els().list; if(!host) return;
        if(!list.length){ host.innerHTML = '<div class="palette-empty">Type to search documents and collections…</div>'; return; }
        host.innerHTML = list.map(function(r, i){
          return '<a class="palette-row' + (i===0?' sel':'') + '" href="' + r.url + '" data-i="' + i + '">' +
            '<span class="palette-type">' + r.type + '</span><span class="palette-title">' + r.title +
            '</span><span class="palette-sub">' + (r.subtitle||'') + '</span></a>';
        }).join('');
      }
      function highlight(){ var host = els().list; if(!host) return; [].slice.call(host.querySelectorAll('.palette-row')).forEach(function(el,i){ el.classList.toggle('sel', i===selIdx); }); }
      async function runSearch(q){
        if(!q.trim()){ render([]); return; }
        try{ var res = await fetch('/api/search?q=' + encodeURIComponent(q)); var data = await res.json(); render(data.results || []); }
        catch(e){ /* offline */ }
      }
      document.addEventListener('DOMContentLoaded', function(){
        var input = els().input; if(!input) return;
        input.addEventListener('input', function(){
          clearTimeout(debounceTimer);
          var q = input.value;
          debounceTimer = setTimeout(function(){ runSearch(q); }, 150);
        });
        input.addEventListener('keydown', function(e){
          if(e.key === 'ArrowDown'){ e.preventDefault(); selIdx = Math.min(selIdx+1, results.length-1); highlight(); }
          else if(e.key === 'ArrowUp'){ e.preventDefault(); selIdx = Math.max(selIdx-1, 0); highlight(); }
          else if(e.key === 'Enter'){ e.preventDefault(); var r = results[selIdx]; if(r) window.location.href = r.url; }
          else if(e.key === 'Escape'){ closePalette(); }
        });
      });
      document.addEventListener('keydown', function(e){
        if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
          e.preventDefault();
          var p = els().panel;
          if(p && !p.classList.contains('hidden')) closePalette(); else openPalette();
        } else if(e.key === 'Escape'){
          var p2 = els().panel; if(p2 && !p2.classList.contains('hidden')) closePalette();
        }
      });
    })();
  </script>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
  <footer>ContextCore · Sovereign Stack · answers grounded in your own data</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
